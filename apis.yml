name: Embark
description: >-
  Embark Veterinary is a dog genetics company that sells at-home canine DNA
  testing kits for breed identification, health condition and genetic-risk
  screening, trait analysis, and relative matching, alongside supplements and
  breeder/veterinary testing programs. Backed by SoftBank Vision Fund 2, the
  company operates a direct-to-consumer storefront, a help center, and a
  resources/blog library, but does not publish a public developer API,
  developer portal, or API documentation. This profile was surfaced from
  VC-portfolio data; no machine-readable API surface (OpenAPI, AsyncAPI,
  GraphQL, MCP) was found during enrichment.
